# The `extensions:` list is generated by `jext index` from dist/*.jext —
# edit each extension's .jehm and re-pack, do not hand-edit entries.
# The top-level fields (name/publisher/version/description) are preserved
# across runs, so edit those here.
name: JCode Marketplace
publisher: jcode
version: 1.0.0
description: >-
  Registry of installable JCode extensions. Each entry references a compiled .jext package under
  dist/. The JCode app reads this index to browse, then downloads and verifies the .jext to install
  it.
extensions:
  - uniqueName: jcode.ext.gitscm
    name: Source Control
    publisher: jcode
    type: scm
    version: 0.9.0
    category: Source Control
    subcategory: Git
    shortDescription: >-
      Compact git source control in the left drawer — tree/list changes, multi-repo workspaces,
      commit, branch, sync, and GitHub sign-in.
    minJCodeVersion: 1.0.0
    targetJCodeVersion: 1.0.0
    jext: dist/jcode.ext.gitscm-0.9.0.jext
    fingerprint:
      algo: sha256
      value: 70d7cf53d0b24b240423c668bda1b809d98f9b9d47788e2119e34ab3a1bcf682
    requires:
      extensions: []
      sdks:
        - git
    suggests: {}
    icon: dist/icons/jcode.ext.gitscm.png
