# The `extensions:` list is generated by `jext index` from dist/*.jext —
# edit each extension's .jehm and re-pack, do not hand-edit entries.
# The top-level fields (name/publisher/version/description) are preserved
# across runs, so edit those here.
name: JCode Marketplace
publisher: jcode
version: 1.0.0
description: >-
  Registry of installable JCode extensions. Each entry references a compiled .jext package under
  dist/. The JCode app reads this index to browse, then downloads and verifies the .jext to install
  it.
