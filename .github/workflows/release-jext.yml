# Build one JCode extension into a `.jext` and attach it to a GitHub Release.
#
# Called by every extension repo — Dev Packs and Apps alike — so the build lives in one file rather
# than fifteen copies that drift. The caller is four lines; everything that varies between an
# extension with no build step, one that runs esbuild, and one that runs Gradle is decided here by
# looking at the repo rather than by asking the caller to declare it.
#
# **This produces a PLAIN `.jext`, never a signed one.** Signing is the marketplace's job and the
# signing key never reaches CI: it is the root of trust for code that runs inside JCode's own
# process, and fifteen public repos is not where that belongs. A release asset from here is
# installable as a development sideload; the native extensions among them will refuse to load their
# dex until the same package is signed for the marketplace. That is the intended shape.
name: Release .jext

on:
  workflow_call:
    inputs:
      java-version:
        description: JDK used when the extension has a Gradle module. Ignored when it has none.
        type: string
        default: '21'
      android-platform:
        description: Android platform installed for a Gradle build; must cover the module's compileSdk.
        type: string
        default: 'platforms;android-36'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # The release, and nothing else: this workflow reads code and publishes one artifact.
      contents: write
    steps:
      - name: Check out the extension
        uses: actions/checkout@v4

      - name: Read the manifest
        id: manifest
        # Node rather than a YAML parser: `version: 1.10` is a string to everyone except a YAML
        # loader, which reads it as the number 1.1 and would tag the wrong release.
        run: |
          read_field() {
            node -e "
              const src = require('fs').readFileSync('extension.yaml', 'utf8');
              const m = src.match(/^$1:[ \t]*(.+)$/m);
              if (!m) { console.error('extension.yaml has no $1:'); process.exit(1); }
              console.log(m[1].trim().replace(/\s+#.*$/, '').replace(/^['\"]|['\"]$/g, ''));
            "
          }
          {
            echo "id=$(read_field id)"
            echo "version=$(read_field version)"
            echo "name=$(read_field name)"
          } >> "$GITHUB_OUTPUT"

      - name: Decide whether this version is already out
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        # The tag is the record of what shipped, so it is also the gate. A merge that changed code
        # but not the version finds its tag already there and stops — which is the same answer as
        # "nothing to release" without needing to diff against the previous commit, and it survives
        # squash merges, re-runs and a manual dispatch alike.
        run: |
          tag="v${{ steps.manifest.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists — nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

      - name: Look for a Gradle module
        id: shape
        if: steps.gate.outputs.release == 'true'
        # Native extensions keep theirs under `native/` or `studio/`; the rest have none. Detected
        # rather than declared so a caller never has to keep a flag in step with its own layout.
        run: |
          if find . -maxdepth 2 -name gradlew -not -path './.git/*' | grep -q .; then
            echo "gradle=true" >> "$GITHUB_OUTPUT"
          else
            echo "gradle=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.gate.outputs.release == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK
        if: steps.gate.outputs.release == 'true' && steps.shape.outputs.gradle == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: gradle

      - name: Set up the Android SDK
        if: steps.gate.outputs.release == 'true' && steps.shape.outputs.gradle == 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: ${{ inputs.android-platform }}

      - name: Check out the packer
        if: steps.gate.outputs.release == 'true'
        uses: actions/checkout@v4
        with:
          repository: blamspotdev/j-code-make-tools
          path: .jext-tools
          # A token only while the packer is private; the job's own token is enough once it is not,
          # so this keeps working either way and the secret can simply be deleted.
          token: ${{ secrets.JEXT_TOOLS_TOKEN || github.token }}

      - name: Install the packer
        if: steps.gate.outputs.release == 'true'
        run: npm ci --no-audit --no-fund
        working-directory: .jext-tools

      - name: Make the Gradle wrapper runnable
        if: steps.gate.outputs.release == 'true' && steps.shape.outputs.gradle == 'true'
        # The wrapper is committed non-executable by repos worked on from Windows, and `build.mjs`
        # spawns it by absolute path — which is a permission error on Linux rather than a shell
        # falling back to `sh gradlew`. Normalised here so CI does not depend on the mode any one
        # branch happens to carry.
        run: find . -maxdepth 2 -name gradlew -not -path './.git/*' -exec chmod +x {} +

      - name: Pack
        if: steps.gate.outputs.release == 'true'
        # `jext pack` runs the extension's own `npm run build` when it declares one, so this single
        # command covers all three shapes: no build step, esbuild, and Gradle.
        run: node .jext-tools/bin/jext.js pack . -o out

      - name: Publish the release
        if: steps.gate.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="out/${{ steps.manifest.outputs.id }}-${{ steps.manifest.outputs.version }}.jext"
          test -f "$asset" || { echo "packer did not produce $asset"; ls -l out; exit 1; }
          # The body is written here rather than left to --generate-notes so the unsigned caveat is
          # the first thing read; the commit list is a link away rather than inlined.
          previous=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""')
          {
            echo "\`${{ steps.manifest.outputs.id }}\` ${{ steps.manifest.outputs.version }}, packed from \`${GITHUB_SHA:0:7}\`."
            echo
            echo "**This package is unsigned.** It installs as a development sideload. An extension"
            echo "that ships native code will not load it until the same package has been signed for"
            echo "the [JCode marketplace](https://github.com/blamspotdev/j-code-marketplace), which is"
            echo "where a release meant for everyday use comes from."
            if [ -n "$previous" ]; then
              echo
              echo "[Changes since $previous](${{ github.server_url }}/${{ github.repository }}/compare/$previous...${{ steps.gate.outputs.tag }})"
            fi
          } > notes.md
          gh release create "${{ steps.gate.outputs.tag }}" "$asset" \n            --title "${{ steps.manifest.outputs.name }} ${{ steps.manifest.outputs.version }}" \n            --notes-file notes.md
